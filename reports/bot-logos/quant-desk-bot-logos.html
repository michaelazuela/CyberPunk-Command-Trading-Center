<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quant Desk Bot Logos</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05080d;
      --panel: #08111a;
      --panel-2: #0b1822;
      --cyan: #32d8ff;
      --cyan-soft: rgba(50, 216, 255, 0.35);
      --green: #42f5a1;
      --orange: #ffad3d;
      --red: #ff4f58;
      --gold: #ffd166;
      --white: #eef8ff;
      --muted: #8ba5b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 12%, rgba(50, 216, 255, 0.18), transparent 28%),
        radial-gradient(circle at 78% 20%, rgba(255, 79, 88, 0.13), transparent 24%),
        linear-gradient(135deg, #020407 0%, var(--bg) 48%, #0b1018 100%);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--white);
    }

    .sheet {
      width: 3600px;
      height: 1400px;
      padding: 88px;
      position: relative;
      overflow: hidden;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(50, 216, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50, 216, 255, 0.12) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 78%);
      pointer-events: none;
    }

    .masthead {
      position: relative;
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 58px;
      border-bottom: 2px solid rgba(50, 216, 255, 0.28);
      padding-bottom: 30px;
    }

    .brand-kicker {
      color: var(--cyan);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-size: 82px;
      line-height: 0.94;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .meta {
      color: var(--muted);
      font-size: 28px;
      font-weight: 700;
      text-align: right;
      line-height: 1.45;
    }

    .logo-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 58px;
    }

    .logo-card {
      width: 1084px;
      height: 1084px;
      position: relative;
      padding: 52px;
      border: 2px solid rgba(50, 216, 255, 0.26);
      border-radius: 36px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)),
        radial-gradient(circle at 50% 30%, rgba(50,216,255,0.16), transparent 45%),
        linear-gradient(145deg, rgba(8,17,26,0.96), rgba(3,8,13,0.98));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.035) inset,
        0 26px 80px rgba(0,0,0,0.42),
        0 0 54px rgba(50,216,255,0.10);
      overflow: hidden;
    }

    .logo-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(50,216,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50,216,255,0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.62;
      mask-image: radial-gradient(circle at center, black 0%, transparent 76%);
      pointer-events: none;
    }

    .logo-card::after {
      content: "Decision Support Only";
      position: absolute;
      left: 52px;
      right: 52px;
      bottom: 30px;
      color: rgba(238,248,255,0.52);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
      text-align: center;
    }

    .mark {
      position: relative;
      width: 100%;
      height: 735px;
      display: grid;
      place-items: center;
    }

    .name {
      position: relative;
      margin-top: 18px;
      font-size: 58px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      text-align: center;
      color: var(--white);
      text-transform: lowercase;
    }

    .role {
      position: relative;
      margin-top: 20px;
      color: var(--muted);
      font-size: 25px;
      line-height: 1.25;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }

    svg {
      width: 700px;
      height: 700px;
      overflow: visible;
    }

    .stroke-cyan { stroke: var(--cyan); }
    .stroke-green { stroke: var(--green); }
    .stroke-orange { stroke: var(--orange); }
    .stroke-red { stroke: var(--red); }
    .stroke-gold { stroke: var(--gold); }
    .fill-cyan { fill: var(--cyan); }
    .fill-green { fill: var(--green); }
    .fill-orange { fill: var(--orange); }
    .fill-red { fill: var(--red); }
    .fill-gold { fill: var(--gold); }
    .fill-panel { fill: #07131d; }
    .fill-white { fill: var(--white); }
    .muted-stroke { stroke: rgba(238,248,255,0.18); }
    .thin { stroke-width: 4; }
    .med { stroke-width: 8; }
    .heavy { stroke-width: 16; }
    .round { stroke-linecap: round; stroke-linejoin: round; }
    .no-fill { fill: none; }
    .soft { opacity: 0.38; }
    .mid { opacity: 0.66; }
    .label-text {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-weight: 950;
      letter-spacing: 0;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <div>
        <div class="brand-kicker">YourMomsTrader Quant Desk</div>
        <h1>Bot Command Logos</h1>
      </div>
      <div class="meta">
        Futures desk operations<br />
        Structure first • Risk always
      </div>
    </header>

    <section class="logo-grid">
      <article class="logo-card" id="quant-desk-ops">
        <div class="mark">
          <svg viewBox="0 0 700 700" aria-label="quant-desk-ops logo">
            <defs>
              <filter id="qdo-glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="7" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <linearGradient id="qdo-grad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#32d8ff" />
                <stop offset="1" stop-color="#42f5a1" />
              </linearGradient>
            </defs>
            <circle cx="350" cy="350" r="284" class="no-fill muted-stroke thin" />
            <circle cx="350" cy="350" r="226" class="no-fill stroke-cyan med round soft" />
            <path d="M350 74 L404 182 L523 205 L438 290 L459 410 L350 354 L241 410 L262 290 L177 205 L296 182 Z" fill="rgba(50,216,255,0.10)" stroke="url(#qdo-grad)" stroke-width="10" filter="url(#qdo-glow)" />
            <path d="M176 350 H524 M350 176 V524" class="no-fill stroke-cyan thin round mid" />
            <path d="M248 450 H452 M248 250 H452 M250 248 V452 M450 248 V452" class="no-fill muted-stroke thin" />
            <g filter="url(#qdo-glow)">
              <rect x="268" y="328" width="26" height="86" rx="8" class="fill-green" />
              <line x1="281" y1="296" x2="281" y2="446" class="stroke-green thin round" />
              <rect x="323" y="266" width="26" height="122" rx="8" class="fill-cyan" />
              <line x1="336" y1="232" x2="336" y2="420" class="stroke-cyan thin round" />
              <rect x="378" y="304" width="26" height="104" rx="8" class="fill-gold" />
              <line x1="391" y1="270" x2="391" y2="448" class="stroke-gold thin round" />
            </g>
            <circle cx="350" cy="350" r="72" fill="#07131d" stroke="url(#qdo-grad)" stroke-width="10" filter="url(#qdo-glow)" />
            <text x="350" y="354" class="label-text fill-white" font-size="88">QDO</text>
          </svg>
        </div>
        <div class="name">quant-desk-ops</div>
        <div class="role">command center • routing • ops control</div>
      </article>

      <article class="logo-card" id="scanner-health">
        <div class="mark">
          <svg viewBox="0 0 700 700" aria-label="scanner-health logo">
            <defs>
              <filter id="sh-glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="7" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <linearGradient id="sh-grad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#42f5a1" />
                <stop offset="1" stop-color="#32d8ff" />
              </linearGradient>
            </defs>
            <circle cx="350" cy="350" r="284" class="no-fill muted-stroke thin" />
            <path d="M350 100 L548 182 V330 C548 466 465 560 350 606 C235 560 152 466 152 330 V182 Z" fill="rgba(66,245,161,0.10)" stroke="url(#sh-grad)" stroke-width="12" filter="url(#sh-glow)" />
            <path d="M206 350 H268 L302 286 L356 454 L404 330 H494" class="no-fill stroke-green heavy round" filter="url(#sh-glow)" />
            <path d="M206 424 C262 468 312 490 350 490 C388 490 438 468 494 424" class="no-fill stroke-cyan med round mid" />
            <path d="M226 238 H474 M226 278 H474 M226 318 H474" class="no-fill muted-stroke thin soft" />
            <circle cx="350" cy="350" r="74" fill="#07131d" stroke="url(#sh-grad)" stroke-width="10" filter="url(#sh-glow)" />
            <text x="350" y="355" class="label-text fill-white" font-size="102">SH</text>
            <circle cx="540" cy="156" r="28" class="fill-green" filter="url(#sh-glow)" />
          </svg>
        </div>
        <div class="name">scanner-health</div>
        <div class="role">heartbeat • bridge status • data freshness</div>
      </article>

      <article class="logo-card" id="system-alerts">
        <div class="mark">
          <svg viewBox="0 0 700 700" aria-label="system-alerts logo">
            <defs>
              <filter id="sa-glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <linearGradient id="sa-grad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#ff4f58" />
                <stop offset="1" stop-color="#ffad3d" />
              </linearGradient>
            </defs>
            <circle cx="350" cy="350" r="284" class="no-fill muted-stroke thin" />
            <path d="M350 112 L598 552 H102 Z" fill="rgba(255,79,88,0.10)" stroke="url(#sa-grad)" stroke-width="14" stroke-linejoin="round" filter="url(#sa-glow)" />
            <path d="M350 238 V390" class="stroke-orange heavy round" filter="url(#sa-glow)" />
            <circle cx="350" cy="462" r="20" class="fill-red" filter="url(#sa-glow)" />
            <path d="M176 520 H524 M220 462 H480 M264 404 H436" class="no-fill muted-stroke thin soft" />
            <path d="M188 304 C238 258 296 232 350 232 C404 232 462 258 512 304" class="no-fill stroke-red med round mid" />
            <path d="M218 254 C258 218 304 198 350 198 C396 198 442 218 482 254" class="no-fill stroke-orange med round soft" />
            <circle cx="350" cy="350" r="82" fill="#07131d" stroke="url(#sa-grad)" stroke-width="10" filter="url(#sa-glow)" />
            <text x="350" y="356" class="label-text fill-white" font-size="104">SA</text>
          </svg>
        </div>
        <div class="name">system-alerts</div>
        <div class="role">risk notices • faults • hard warnings</div>
      </article>
    </section>
  </main>
</body>
</html>
